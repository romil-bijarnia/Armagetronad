# Dedicated teacher-collection profile for Blacklight imitation learning.
# Load this with the dedicated server extra-config option.

SINCLUDE examples/trained_ai_common.cfg

# Collect teacher examples from classic bots; do not run Blacklight in these workers.
AI_TRAINED_ENABLE 0
AI_TRAINED_LEARN 0
AI_TRAINED_AUTOSTART 0
AI_TRAINED_RECORD 1
AI_TRAINED_RECORD_FILE trained_ai_teacher_examples.log
AI_TRAINED_TEACHER_FILE trained_ai_teacher_examples.log
AI_TRAINED_METRICS_FILE trained_ai_training_metrics.csv
AI_TRAINED_POLICY_POOL_SIZE 0
AI_TRAINED_POLICY_HISTORIC_PROB 0

# Local/private teacher server settings.
TALK_TO_MASTER 0
SERVER_NAME Local Blacklight Teacher Collector

# Keep rounds moving quickly.
DEDICATED_FPS 300
DEDICATED_FPS_IDLE_FACTOR 4.0
FINISH_TYPE 2
WIN_ZONE_MIN_ROUND_TIME 25
WIN_ZONE_MIN_LAST_DEATH 8

# Populate the room with classic bots only so they can act as the teacher.
TEAM_BALANCE_WITH_AIS 1
TEAM_MAX_PLAYERS 1
TEAM_MIN_PLAYERS 1
TEAMS_MIN 8
TEAMS_MAX 8
MIN_PLAYERS 8
NUM_AIS 0
AUTO_AIS 0
AI_IQ 100
