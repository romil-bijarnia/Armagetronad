# Dedicated self-play training profile for Blacklight AI.
# Load this with the dedicated server extra-config option.

# Shared Blacklight defaults.
SINCLUDE examples/trained_ai_common.cfg

# Blacklight AI behavior overrides for training.
AI_TRAINED_LEARN 1
AI_TRAINED_AUTOSTART 1
AI_TRAINED_RECORD_FILE trained_ai_selfplay_experience.log
AI_TRAINED_METRICS_FILE trained_ai_training_metrics.csv
AI_TRAINED_BOT_COUNT 1
AI_TRAINED_EXPLORATION 0.14
AI_TRAINED_TRAIN_EPOCHS 4
AI_TRAINED_RECORD_STRIDE 64
AI_TRAINED_SAVE_EVERY 200
AI_TRAINED_CHECKPOINT_EVERY 500
AI_TRAINED_POLICY_POOL_SIZE 0
AI_TRAINED_POLICY_HISTORIC_PROB 0

# Local/private trainer server settings.
TALK_TO_MASTER 0
SERVER_NAME Local Blacklight AI Self-Play Trainer

# Keep rounds moving quickly.
DEDICATED_FPS 300
DEDICATED_FPS_IDLE_FACTOR 4.0
FINISH_TYPE 2
WIN_ZONE_MIN_ROUND_TIME 25
WIN_ZONE_MIN_LAST_DEATH 8

# Bot-only population: one Blacklight-controlled bot fights seven classic built-in bots.
# MIN_PLAYERS fills the room up to eight total bots; leave NUM_AIS at 0 so we do
# not add a second extra pack of classic bots on top of that.
TEAM_BALANCE_WITH_AIS 1
TEAM_MAX_PLAYERS 1
TEAM_MIN_PLAYERS 1
TEAMS_MIN 8
TEAMS_MAX 8
MIN_PLAYERS 8
NUM_AIS 0
AUTO_AIS 0
AI_IQ 100
