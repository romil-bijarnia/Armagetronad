# Shared Blacklight defaults.
# Scenario-specific configs should SINCLUDE this file and override only what differs.

# Enable Blacklight, the trainable neural-network AI.
AI_TRAINED_ENABLE 1

# How many in-game bot players use the Blacklight brain.
# -1 means every AI player uses Blacklight.
AI_TRAINED_BOT_COUNT -1

# Blacklight now uses a local-map policy network (~10.2M parameters).
AI_TRAINED_MODEL_FILE trained_ai_teacher_cnn_model.txt

# Always record match data for future/offline training.
AI_TRAINED_RECORD 1
AI_TRAINED_CHECKPOINT_PREFIX trained_ai_checkpoints/blacklight

# Thinking/training behavior.
AI_TRAINED_THINK_TIME 0.06
AI_TRAINED_LOOKAHEAD_SECONDS 2.5
AI_TRAINED_EXPLORATION 0.08

# Learning hyperparameters.
AI_TRAINED_LEARNING_RATE 0.01
AI_TRAINED_VALUE_LEARNING_RATE 0.01
# Running reward baseline used to center policy updates.
AI_TRAINED_BASELINE_DECAY 0.02
AI_TRAINED_DISCOUNT 0.985
AI_TRAINED_WEIGHT_DECAY 0.0002
AI_TRAINED_WEIGHT_CLIP 5.0
AI_TRAINED_MAX_EPISODE_STEPS 512
AI_TRAINED_TRAIN_EPOCHS 4
AI_TRAINED_RECORD_STRIDE 16
AI_TRAINED_SAVE_EVERY 25
AI_TRAINED_CHECKPOINT_EVERY 50

# Historical policy pool for varied bot versions in self-play.
AI_TRAINED_POLICY_POOL_SIZE 8
AI_TRAINED_POLICY_SNAPSHOT_EVERY 40
AI_TRAINED_POLICY_SNAPSHOT_WARMUP 80
AI_TRAINED_POLICY_HISTORIC_PROB 0.35

# Reward shaping (distance + round outcome).
AI_TRAINED_REWARD_DISTANCE 0.002
AI_TRAINED_REWARD_WIN 2.0
AI_TRAINED_REWARD_DEATH -2.0
